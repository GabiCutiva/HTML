<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi sitio con Bootstrap 5.3</title>
  
  <!-- 1. CSS de Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- 2. Tu CSS personalizado dentro de <style> -->
  <style>
    body {
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
    }

    .bandera {
        display: flex;     
        width: 300px;      
        height: 200px;     
        border: 2px solid #333; 
    }

    .verde {
        background-color: green;
        width: 33.33%;
        height: 100%;
    }

    .blanco {
        background-color: white;
        width: 33.33%;
        height: 100%;
    }

    .rojo {
        background-color: red;
        width: 33.33%;
        height: 100%;
    }
  </style>
</head>
<body>

  <!-- NAVBAR DE BOOTSTRAP -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MiLogo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Características</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Precios</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1>¡Hola, Bootstrap 5.3!</h1>
    <p>A continuación se muestra la bandera en 3 columnas:</p>
    
    <!-- AQUÍ SE AGREGA LA BANDERA -->
    <div class="bandera mt-3">
      <div class="verde"></div>
      <div class="blanco"></div>
      <div class="rojo"></div>
    </div>
  </div>

  <!-- JavaScript de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
